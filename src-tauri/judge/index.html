<!doctype html>
<!--
  Mobile judging page served by judge_server.rs over the LAN. Self-contained (no build step):
  inline CSS + vanilla JS calling the /api endpoints. The access code is stored in localStorage
  and sent as the X-Judge-Code header on every request.
  shortcut: parseDuration/formatDuration are a port of src/engine/time.ts — keep in sync if the
  Speed Fit time format ever changes.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Judging</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      :root { --navy: #0b1f4d; --gold: #c8a04f; --line: #e3e6ec; --muted: #6b7280; --bad: #b42318; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #111; background: #f4f5f7; }
      header { position: sticky; top: 0; background: var(--navy); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header button { background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
      main { padding: 16px; max-width: 640px; margin: 0 auto; }
      .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      select, input { width: 100%; font-size: 17px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
      .field { margin-bottom: 12px; }
      .field:last-child { margin-bottom: 0; }
      .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .row:last-child { border-bottom: none; }
      .bib { flex: 0 0 44px; height: 44px; border-radius: 10px; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
      .who { flex: 1; min-width: 0; }
      .who .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .who .sub { font-size: 12px; color: var(--muted); }
      .row input { flex: 0 0 96px; text-align: center; }
      .row input.time { flex: 0 0 120px; }
      .row input.invalid { border-color: var(--bad); }
      .note { font-size: 13px; color: var(--muted); text-align: center; padding: 24px 0; }
      #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90%; opacity: 0; transition: opacity .2s; pointer-events: none; }
      #toast.show { opacity: 1; }
      #toast.bad { background: var(--bad); }
      #gate { position: fixed; inset: 0; background: var(--navy); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
      #gate.hidden { display: none; }
      #gate input { max-width: 240px; text-align: center; letter-spacing: 4px; font-size: 22px; color: #111; }
      #gate button { background: var(--gold); color: #111; border: none; border-radius: 10px; padding: 12px 24px; font-size: 16px; font-weight: 600; }
      #gate .err { color: #ffd0cb; font-size: 14px; min-height: 18px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Judging</h1>
      <button id="change-code" type="button">Code</button>
    </header>
    <main>
      <div id="nav"></div>
      <div id="rows" class="card"></div>
    </main>
    <div id="toast"></div>
    <div id="gate" class="hidden">
      <div style="font-size:18px;font-weight:600">Enter the access code</div>
      <input id="gate-input" inputmode="numeric" autocomplete="off" placeholder="000000" />
      <div class="err" id="gate-err"></div>
      <button id="gate-submit" type="button">Connect</button>
    </div>

    <script>
      const CODE_KEY = "judgeCode";
      const SEL_KEY = "judgeSel";
      let data = null; // last /api/state payload
      let sel = loadSel(); // { compId, catId, setId, station }
      let structureKey = ""; // changes when the chosen comp/category/set/station or its athletes change
      let navKey = ""; // changes when the pickers' options or selection change
      let lastPoll = 0, newestShown = 0; // an older answer arriving late must not replace a newer one
      let gatePinned = false; // the judge opened the code screen: a working poll must not close it
      const MAX_REPS = 9999; // db/scores.ts
      // Results the laptop hasn't confirmed, by field: { path, body, text, okMsg, failed, sending }. Fields
      // show these over the polled value, and failed ones are sent again after each poll, whatever is on screen.
      // shortcut: kept in memory, so reloading the page drops them; use localStorage if phones reload mid-outage.
      const unsaved = new Map();
      const scoreField = (entryId, setId, stationNumber) => `score:${entryId}:${setId}:${stationNumber}`;
      const timeField = (entryId) => `time:${entryId}`;

      function loadSel() {
        try { return JSON.parse(localStorage.getItem(SEL_KEY)) || {}; } catch { return {}; }
      }
      function saveSel() { localStorage.setItem(SEL_KEY, JSON.stringify(sel)); }

      function toast(msg, bad) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "show" + (bad ? " bad" : "");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => (el.className = ""), 2600);
      }

      // --- API ---
      async function api(path, options) {
        const code = localStorage.getItem(CODE_KEY) || "";
        const res = await fetch(path, {
          ...options,
          headers: { "Content-Type": "application/json", "X-Judge-Code": code, ...(options && options.headers) },
        });
        if (res.status === 401) { showGate(); throw new Error("unauthorized"); }
        if (res.status === 429) {
          showGate();
          document.getElementById("gate-err").textContent = "Too many wrong codes. Wait a minute and try again.";
          throw new Error("unauthorized");
        }
        return res;
      }

      async function refresh() {
        const poll = ++lastPoll;
        let res;
        try {
          res = await api("/api/state");
        } catch (e) {
          if (e.message !== "unauthorized") toast("Can't reach the laptop. Retrying…", true);
          return;
        }
        if (!res.ok) { toast("The laptop couldn't read the results. Retrying…", true); return; }
        const fresh = await res.json();
        if (poll < newestShown) return;
        newestShown = poll;
        for (const c of fresh.competitions) c.categories = namedCategories(c.categories);
        data = fresh;
        if (!gatePinned) hideGate();
        render();
        for (const [field, save] of unsaved) {
          if (save.failed && !save.sending) send(field, save.path, save.body, save.text, save.okMsg, true);
        }
      }

      // --- Category names (port of src/lib/labels.ts, so phones read like the app; consistency.test.ts compares them) ---
      const SEX_WORDS = { male: /\b(men|male|man)\b/i, female: /\b(women|female|woman)\b/i, mixed: /\bmixed\b/i };
      const SEX_NAMES = { male: "Men", female: "Women", mixed: "Mixed" };
      const FORMAT_WORDS = { individual: /(?!)/, couple: /\b(couples?|pairs?)\b/i, team: /\bteams?\b/i };
      const FORMAT_NAMES = { individual: "", couple: "Couple", team: "Team" };
      function compactAgeRange({ minAge, maxAge }) {
        if (minAge !== null && maxAge !== null) return minAge === maxAge ? `${minAge}` : `${minAge}–${maxAge}`;
        if (minAge !== null) return `${minAge}+`;
        if (maxAge !== null) return `up to ${maxAge}`;
        return "";
      }
      function mentions(text, phrase) {
        const words = (value) => ` ${value.replace(/\s*[-‐-―]\s*/g, "–").toLowerCase().split(/\s+/).filter(Boolean).join(" ")} `;
        return phrase.trim() !== "" && words(text).includes(words(phrase));
      }
      function subgroupName(ageGroup, rules) {
        const range = compactAgeRange(rules);
        return [
          ageGroup.trim(),
          SEX_WORDS[rules.gender].test(ageGroup) ? "" : SEX_NAMES[rules.gender],
          FORMAT_WORDS[rules.format].test(ageGroup) ? "" : FORMAT_NAMES[rules.format],
          mentions(ageGroup, range) ? "" : range,
        ].filter(Boolean).join(" ");
      }
      function categoryName(ageGroup, rules, level) {
        const subgroup = subgroupName(ageGroup, rules);
        return !level || mentions(ageGroup, level) ? subgroup : `${subgroup} · ${level}`;
      }
      // --- End of the port ---

      // Named and ordered like listCategories in src/db/categories.ts: each sub-group's levels together.
      function namedCategories(categories) {
        const groups = new Map();
        for (const k of categories) {
          const key = k.ageGroup ? JSON.stringify([k.ageGroup, k.format, k.gender, k.minAge, k.maxAge]) : `name:${k.name}`;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(k.ageGroup ? { ...k, name: categoryName(k.ageGroup, k, k.level) } : k);
        }
        return [...groups.values()].flat();
      }

      // --- Time helpers (port of src/engine/time.ts) ---
      const MAX_TIME_MS = 24 * 60 * 60 * 1000 - 10;
      function parseDuration(text) {
        const m = /^(?:(?:(\d+):)?(\d+):)?(\d+)(?:[.,](\d{1,2}))?$/.exec(text.trim());
        if (!m) return undefined;
        const [, h, mi, s, fr] = m;
        const hours = Number(h ?? 0), minutes = Number(mi ?? 0), seconds = Number(s);
        if (mi !== undefined && seconds > 59) return undefined;
        if (h !== undefined && minutes > 59) return undefined;
        const hundredths = Number((fr ?? "0").padEnd(2, "0"));
        const ms = ((hours * 60 + minutes) * 60 + seconds) * 1000 + hundredths * 10;
        return ms > 0 && ms <= MAX_TIME_MS ? ms : undefined;
      }
      function formatDuration(ms) {
        const hundredths = Math.round(ms / 10);
        const pad = (n) => String(n).padStart(2, "0");
        const totalSeconds = Math.floor(hundredths / 100);
        const fraction = pad(hundredths % 100);
        const seconds = totalSeconds % 60;
        const totalMinutes = Math.floor(totalSeconds / 60);
        if (totalMinutes >= 60) return `${Math.floor(totalMinutes / 60)}:${pad(totalMinutes % 60)}:${pad(seconds)}.${fraction}`;
        return `${totalMinutes}:${pad(seconds)}.${fraction}`;
      }

      // --- Lookups into the current payload ---
      const comps = () => (data ? data.competitions : []);
      const comp = () => comps().find((c) => c.id === sel.compId) || comps()[0] || null;
      const categoriesOf = (c) => (c ? c.categories : []);
      const category = (c) => categoriesOf(c).find((x) => x.id === sel.catId) || categoriesOf(c)[0] || null;
      const entriesOf = (c, cat) => (c && cat ? c.entries.filter((e) => e.categoryId === cat.id) : []);
      const setsOf = (c, cat) => (c && cat ? c.stationSets.filter((s) => cat.stationSetIds.includes(s.id)) : []);
      const stationSet = (c, cat) => setsOf(c, cat).find((s) => s.id === sel.setId) || setsOf(c, cat)[0] || null;

      // --- Rendering ---
      function render() {
        const navEl = document.getElementById("nav");
        const rowsEl = document.getElementById("rows");
        const list = comps();
        if (list.length === 0) {
          navEl.innerHTML = "";
          rowsEl.innerHTML = '<div class="note">No competition is running. Ask the organiser to start one.</div>';
          structureKey = "";
          navKey = "";
          return;
        }

        const c = comp();
        sel.compId = c.id;
        const cat = category(c);
        if (cat) sel.catId = cat.id;
        const fitness = c.kind !== "speed_fit";
        let set = null, station = null;
        if (fitness) {
          set = stationSet(c, cat);
          if (set) {
            sel.setId = set.id;
            const stations = set.stations.map((s) => s.stationNumber);
            if (!stations.includes(sel.station)) sel.station = stations[0];
            station = set.stations.find((s) => s.stationNumber === sel.station) || null;
          }
        }
        saveSel();

        // Only rebuild the pickers when their options, labels or selection change, so a poll refresh
        // doesn't close a dropdown the judge is using.
        const nav = navHtml(c, cat, fitness, set);
        if (nav !== navKey) {
          navKey = nav;
          navEl.innerHTML = nav;
          wireNav();
        }

        // Rebuilt for another station or when the athletes change (a late entry), but not under the
        // field the judge is typing in: the next poll after they leave it catches up.
        const rows = rowsHtml(c, cat, fitness, set, station);
        const key = [c.id, cat && cat.id, fitness, set && set.id, station && station.stationNumber, rows].join("|");
        if (key !== structureKey && !rowsEl.contains(document.activeElement)) {
          structureKey = key;
          rowsEl.innerHTML = rows;
          wireRows(c, fitness, set, station);
        }
        if (key === structureKey) applyValues(c, fitness, set, station);
      }

      function selectHtml(id, label, options, selected) {
        const opts = options.map((o) => `<option value="${o.value}"${o.value === selected ? " selected" : ""}>${esc(o.label)}</option>`).join("");
        return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts}</select></div>`;
      }

      function navHtml(c, cat, fitness, set) {
        let html = '<div class="card">';
        if (comps().length > 1) {
          html += selectHtml("sel-comp", "Competition", comps().map((x) => ({ value: x.id, label: x.name })), c.id);
        }
        const cats = categoriesOf(c);
        html += selectHtml("sel-cat", "Category", cats.map((x) => ({ value: x.id, label: x.name })), cat ? cat.id : undefined);
        if (fitness) {
          const sets = setsOf(c, cat);
          if (sets.length > 1) html += selectHtml("sel-set", "Station set", sets.map((x) => ({ value: x.id, label: x.name })), set ? set.id : undefined);
          if (set) {
            const stationOpts = set.stations.map((s) => ({ value: s.stationNumber, label: `Station ${s.stationNumber}${s.exerciseName ? " — " + s.exerciseName : ""}` }));
            html += selectHtml("sel-station", "Station", stationOpts, sel.station);
          }
        }
        return html + "</div>";
      }

      function wireNav() {
        const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("change", fn); };
        on("sel-comp", (e) => { sel.compId = Number(e.target.value); sel.catId = undefined; sel.setId = undefined; sel.station = undefined; render(); });
        on("sel-cat", (e) => { sel.catId = Number(e.target.value); sel.setId = undefined; sel.station = undefined; render(); });
        on("sel-set", (e) => { sel.setId = Number(e.target.value); sel.station = undefined; render(); });
        on("sel-station", (e) => { sel.station = Number(e.target.value); render(); });
      }

      function rowsHtml(c, cat, fitness, set, station) {
        const entries = entriesOf(c, cat);
        if (entries.length === 0) return '<div class="note">No athletes in this category.</div>';
        if (fitness && !station) return '<div class="note">Pick a station set for this category in the app.</div>';
        return entries
          .map((e) => {
            const field = fitness
              ? `<input class="reps" inputmode="numeric" data-entry="${e.id}" aria-label="Reps for number ${e.bibNumber}" />`
              : `<input class="time" inputmode="text" placeholder="m:ss.cc" data-entry="${e.id}" aria-label="Time for number ${e.bibNumber}" />`;
            return `<div class="row"><div class="bib">${e.bibNumber}</div><div class="who"><div class="name">${esc(e.name)}</div><div class="sub">${esc(e.country || "")}</div></div>${field}</div>`;
          })
          .join("");
      }

      function wireRows(c, fitness, set, station) {
        document.querySelectorAll("#rows input").forEach((input) => {
          const entryId = Number(input.dataset.entry);
          const commit = () => (fitness ? commitScore(input, entryId, set.id, station.stationNumber) : commitTime(input, entryId));
          input.addEventListener("change", commit);
        });
      }

      // Refresh saved values without disturbing the field the judge is typing in.
      function applyValues(c, fitness, set, station) {
        document.querySelectorAll("#rows input").forEach((input) => {
          const entryId = Number(input.dataset.entry);
          const save = unsaved.get(fitness ? scoreField(entryId, set.id, station.stationNumber) : timeField(entryId));
          if (save && save.failed) input.classList.add("invalid");
          if (document.activeElement === input) return;
          if (save) {
            input.value = save.text;
            input.classList.toggle("invalid", save.failed);
            return;
          }
          if (fitness) {
            const score = c.scores.find((s) => s.entryId === entryId && s.setId === set.id && s.stationNumber === station.stationNumber);
            input.value = score ? String(score.reps) : "";
          } else {
            const t = c.times.find((x) => x.entryId === entryId);
            input.value = t ? formatDuration(t.timeMs) : "";
          }
          input.classList.remove("invalid");
        });
      }

      async function commitScore(input, entryId, setId, stationNumber) {
        const raw = input.value.trim();
        const reps = raw === "" ? null : Number(raw);
        if (reps !== null && (!/^\d+$/.test(raw) || reps > MAX_REPS)) { input.classList.add("invalid"); toast(`Reps must be a whole number from 0 to ${MAX_REPS}.`, true); return; }
        input.classList.remove("invalid");
        await send(scoreField(entryId, setId, stationNumber), "/api/score", { entryId, setId, stationNumber, reps }, raw, "Reps saved");
      }

      async function commitTime(input, entryId) {
        const raw = input.value.trim();
        let timeMs = null;
        if (raw !== "") {
          timeMs = parseDuration(raw);
          if (timeMs === undefined) { input.classList.add("invalid"); toast("That is not a valid time.", true); return; }
        }
        input.classList.remove("invalid");
        await send(timeField(entryId), "/api/time", { entryId, timeMs }, raw, "Time saved");
      }

      // `retry` keeps a failed field red until the laptop has the result.
      async function send(field, path, body, text, okMsg, retry = false) {
        const save = { path, body, text, okMsg, failed: retry, sending: true };
        unsaved.set(field, save);
        try {
          const res = await api(path, { method: "POST", body: JSON.stringify(body) });
          if (unsaved.get(field) !== save) return; // typed again meanwhile: the newer save decides
          unsaved.delete(field);
          // A refused result won't be accepted later either, so the field goes back to what is saved.
          toast(res.ok ? okMsg : await res.text(), !res.ok);
          refresh();
        } catch (e) {
          if (e.message !== "unauthorized") toast("Couldn't save. Check the connection.", true);
          save.failed = true;
          save.sending = false;
          render();
        }
      }

      function esc(s) { return String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

      // --- Access-code gate ---
      function showGate() {
        const g = document.getElementById("gate");
        g.classList.remove("hidden");
        document.getElementById("gate-err").textContent = localStorage.getItem(CODE_KEY) ? "That code didn't work." : "";
        document.getElementById("gate-input").focus();
      }
      function hideGate() { document.getElementById("gate").classList.add("hidden"); }
      function submitCode() {
        const val = document.getElementById("gate-input").value.trim();
        if (val) localStorage.setItem(CODE_KEY, val);
        gatePinned = false; // nothing typed: closes again if the saved code still works
        refresh();
      }
      document.getElementById("gate-submit").addEventListener("click", submitCode);
      document.getElementById("gate-input").addEventListener("keydown", (e) => { if (e.key === "Enter") submitCode(); });
      document.getElementById("change-code").addEventListener("click", () => {
        gatePinned = true;
        showGate();
        document.getElementById("gate-err").textContent = "";
      });

      // --- Start ---
      if (!localStorage.getItem(CODE_KEY)) showGate();
      refresh();
      setInterval(refresh, 3000);
    </script>
  </body>
</html>
