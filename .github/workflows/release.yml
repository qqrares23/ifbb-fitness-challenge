name: Release

# Push a tag like v0.1.0 (or run manually) to build the installers. They are attached to a
# draft GitHub release, which stays private until you publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg that runs natively on both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: IFBB Fitness Challenge v__VERSION__
          releaseBody: Download the .dmg for macOS (Apple Silicon and Intel) or the .msi / setup.exe for Windows.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
