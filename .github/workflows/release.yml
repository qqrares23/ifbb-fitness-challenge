name: Release

# Push a tag like v0.1.0 to build the installers and publish them as a GitHub release with
# latest.json (a manual run only makes a draft), which installed apps check at startup to update
# themselves (see the updater in src-tauri/tauri.conf.json). Updates are signed with the key in
# the TAURI_SIGNING_PRIVATE_KEY secret; the matching public key is in tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: A version tag must match package.json (the release is named after package.json)
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # The Rust side embeds the built frontend, so it has to exist for the tests to compile.
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg that runs natively on both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # Built on the oldest supported Ubuntu so the .deb / .AppImage run on older distros too.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: IFBB Fitness Challenge v__VERSION__
          releaseBody: "macOS (Apple Silicon and Intel): .dmg · Windows: setup.exe or .msi · Linux: .AppImage, .deb or .rpm"
          # A draft until every platform is in; the publish job then makes it releases/latest.
          releaseDraft: true
          prerelease: false
          # Windows apps update with the setup.exe they were installed with, not the .msi.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # Publishes the release only once every platform has built and is listed in latest.json (the
  # build jobs merge their entries into it one by one), so installed apps never see half a release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: latest.json lists every platform
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          for platform in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].url' latest.json > /dev/null || { echo "latest.json is missing $platform: re-run the failed job"; exit 1; }
          done
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
